<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sunnyside Solutions - App Development Studio</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <nav class="nav">
            <div class="nav-brand">
                <div class="logo">
                    <div class="sun-logo">
                        <div class="sun-center"></div>
                        <div class="sun-rays">
                            <div class="ray"></div>
                            <div class="ray"></div>
                            <div class="ray"></div>
                            <div class="ray"></div>
                            <div class="ray"></div>
                            <div class="ray"></div>
                            <div class="ray"></div>
                            <div class="ray"></div>
                        </div>
                    </div>
                    <div class="moon-logo">
                        <div class="moon-center">
                            <div class="moon-crater crater-1"></div>
                            <div class="moon-crater crater-2"></div>
                            <div class="moon-crater crater-3"></div>
                        </div>
                        <div class="moon-stars">
                            <div class="star"></div>
                            <div class="star"></div>
                            <div class="star"></div>
                            <div class="star"></div>
                        </div>
                    </div>
                    <span class="brand-name">Sunnyside Solutions</span>
                </div>
            </div>
            <div class="nav-links">
                <a href="#contact" class="nav-link nav-cta">Contact</a>
            </div>
        </nav>
    </header>

    <main class="main">
        <section class="hero">
            <div class="hero-content">
                <h1 class="hero-title">
                    We build cool mobile apps
                </h1>
                <p class="hero-subtitle">
                    We love building cool mobile apps. There's really not much else to say...
                </p>
                <div class="hero-cta">
                    <button id="theme-toggle" class="btn btn-primary theme-toggle">
                        <span class="theme-toggle-text"><strong>feeling sleepy?</strong></span>
                    </button>
                </div>
            </div>
            <div class="hero-visual">
                <div class="floating-cards">
                    <div class="card card-1">
                        <div class="card-header"></div>
                        <div class="card-content">
                            <div class="card-line"></div>
                            <div class="card-line short"></div>
                        </div>
                    </div>
                    <div class="card card-2">
                        <div class="card-header"></div>
                        <div class="card-content">
                            <div class="card-line"></div>
                            <div class="card-line medium"></div>
                            <div class="card-line short"></div>
                        </div>
                    </div>
                    <div class="card card-3">
                        <div class="card-header"></div>
                        <div class="card-content">
                            <div class="card-line"></div>
                            <div class="card-line"></div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
        <section id="contact" class="section">
            <div class="container">
                <div class="contact-content">
                    <h2 class="section-title">Curious?</h2>
                    <p class="section-subtitle">
                        Get in touch with us.
                    </p>
                    
                    <form class="contact-form" action="https://formspree.io/f/xrbapzlz" method="POST">
                        <div class="form-group">
                            <label for="email" class="form-label">Email</label>
                            <input 
                                type="email" 
                                id="email" 
                                name="email" 
                                class="form-input" 
                                required 
                                placeholder="your@email.com"
                            >
                        </div>
                        
                        <div class="form-group">
                            <label for="message" class="form-label">Message</label>
                            <textarea 
                                id="message" 
                                name="message" 
                                class="form-textarea" 
                                required 
                                placeholder="What's on your mind?"
                                rows="5"
                            ></textarea>
                        </div>
                        
                        <div class="form-submit">
                            <button type="submit" class="btn btn-primary">Send Message</button>
                        </div>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-brand">
                    <div class="logo">
                        <div class="sun-logo small">
                            <div class="sun-center"></div>
                            <div class="sun-rays">
                                <div class="ray"></div>
                                <div class="ray"></div>
                                <div class="ray"></div>
                                <div class="ray"></div>
                                <div class="ray"></div>
                                <div class="ray"></div>
                                <div class="ray"></div>
                                <div class="ray"></div>
                            </div>
                        </div>
                        <div class="moon-logo small">
                            <div class="moon-center">
                                <div class="moon-crater crater-1"></div>
                                <div class="moon-crater crater-2"></div>
                                <div class="moon-crater crater-3"></div>
                            </div>
                            <div class="moon-stars">
                                <div class="star"></div>
                                <div class="star"></div>
                                <div class="star"></div>
                                <div class="star"></div>
                            </div>
                        </div>
                        <span class="brand-name">Sunnyside Solutions</span>
                    </div>
                </div>
                <div class="footer-text">
                    <p>&copy; <span id="copyright-year"></span> Sunnyside Solutions. Made with love in <a href="https://en.wikipedia.org/wiki/Wichita,_Kansas" target="_blank" class="footer-link" style="color: white;">Wichita, Kansas</a>.</p>
                </div>
            </div>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
