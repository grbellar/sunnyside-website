<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sunnyside logo marks</title>
    <style>
        body { margin: 0; padding: 48px 24px 96px; background: #fff; color: #000;
            font: 400 18px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        main { max-width: 960px; margin: 0 auto; }
        h1 { font-size: 28px; line-height: 1.2; margin: 0 0 8px; }
        p { margin: 0 0 24px; color: #555; }
        h2 { font-size: 18px; margin: 40px 0 12px; }
        .row { display: grid; grid-template-columns: 2fr 1fr; gap: 12px; }
        .tile { display: flex; align-items: center; justify-content: center; gap: 24px; padding: 28px 16px; border-radius: 8px; flex-wrap: wrap; }
        .paper { background: #fff; border: 1px solid #ddd; }
        .sky { background: #E6F0FF; }
        .tile span { display: block; }
        .tile svg { display: block; width: 100%; height: auto; }
        @media (max-width: 760px) { .row { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <main>
        <h1>Sunnyside logo marks</h1>
        <p>The six marks from round five at 16, 32, 64 and 160 pixels, then on the sky blue. The 16 pixel one is roughly what a browser tab shows.</p>
        <section>
            <h2>G1. Rays</h2>
            <div class="row">
                <div class="tile paper"><span style="width:16px"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2.5v3.5M16 26v3.5M2.5 16H6M26 16h3.5M6.45 6.45l2.5 2.5M23.05 23.05l2.5 2.5M6.45 25.55l2.5-2.5M23.05 8.95l2.5-2.5" stroke="#1C2B3A" stroke-width="3" stroke-linecap="round"/><circle cx="16" cy="16" r="7" fill="#FFC51A" stroke="#1C2B3A" stroke-width="2.5"/></svg></span><span style="width:32px"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2.5v3.5M16 26v3.5M2.5 16H6M26 16h3.5M6.45 6.45l2.5 2.5M23.05 23.05l2.5 2.5M6.45 25.55l2.5-2.5M23.05 8.95l2.5-2.5" stroke="#1C2B3A" stroke-width="3" stroke-linecap="round"/><circle cx="16" cy="16" r="7" fill="#FFC51A" stroke="#1C2B3A" stroke-width="2.5"/></svg></span><span style="width:64px"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2.5v3.5M16 26v3.5M2.5 16H6M26 16h3.5M6.45 6.45l2.5 2.5M23.05 23.05l2.5 2.5M6.45 25.55l2.5-2.5M23.05 8.95l2.5-2.5" stroke="#1C2B3A" stroke-width="3" stroke-linecap="round"/><circle cx="16" cy="16" r="7" fill="#FFC51A" stroke="#1C2B3A" stroke-width="2.5"/></svg></span><span style="width:160px"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2.5v3.5M16 26v3.5M2.5 16H6M26 16h3.5M6.45 6.45l2.5 2.5M23.05 23.05l2.5 2.5M6.45 25.55l2.5-2.5M23.05 8.95l2.5-2.5" stroke="#1C2B3A" stroke-width="3" stroke-linecap="round"/><circle cx="16" cy="16" r="7" fill="#FFC51A" stroke="#1C2B3A" stroke-width="2.5"/></svg></span></div>
                <div class="tile sky"><span style="width:32px"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2.5v3.5M16 26v3.5M2.5 16H6M26 16h3.5M6.45 6.45l2.5 2.5M23.05 23.05l2.5 2.5M6.45 25.55l2.5-2.5M23.05 8.95l2.5-2.5" stroke="#1C2B3A" stroke-width="3" stroke-linecap="round"/><circle cx="16" cy="16" r="7" fill="#FFC51A" stroke="#1C2B3A" stroke-width="2.5"/></svg></span><span style="width:96px"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2.5v3.5M16 26v3.5M2.5 16H6M26 16h3.5M6.45 6.45l2.5 2.5M23.05 23.05l2.5 2.5M6.45 25.55l2.5-2.5M23.05 8.95l2.5-2.5" stroke="#1C2B3A" stroke-width="3" stroke-linecap="round"/><circle cx="16" cy="16" r="7" fill="#FFC51A" stroke="#1C2B3A" stroke-width="2.5"/></svg></span></div>
            </div>
        </section>
        <section>
            <h2>G2. Horizon</h2>
            <div class="row">
                <div class="tile paper"><span style="width:16px"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M6 20a10 10 0 0 1 20 0z" fill="#FFC51A"/><path d="M2.5 20h27M9 25h14" stroke="#1C2B3A" stroke-width="3" stroke-linecap="round"/><path d="M16 3.5v3M6.8 7.3l2 2M25.2 7.3l-2 2" stroke="#1C2B3A" stroke-width="2.6" stroke-linecap="round"/></svg></span><span style="width:32px"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M6 20a10 10 0 0 1 20 0z" fill="#FFC51A"/><path d="M2.5 20h27M9 25h14" stroke="#1C2B3A" stroke-width="3" stroke-linecap="round"/><path d="M16 3.5v3M6.8 7.3l2 2M25.2 7.3l-2 2" stroke="#1C2B3A" stroke-width="2.6" stroke-linecap="round"/></svg></span><span style="width:64px"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M6 20a10 10 0 0 1 20 0z" fill="#FFC51A"/><path d="M2.5 20h27M9 25h14" stroke="#1C2B3A" stroke-width="3" stroke-linecap="round"/><path d="M16 3.5v3M6.8 7.3l2 2M25.2 7.3l-2 2" stroke="#1C2B3A" stroke-width="2.6" stroke-linecap="round"/></svg></span><span style="width:160px"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M6 20a10 10 0 0 1 20 0z" fill="#FFC51A"/><path d="M2.5 20h27M9 25h14" stroke="#1C2B3A" stroke-width="3" stroke-linecap="round"/><path d="M16 3.5v3M6.8 7.3l2 2M25.2 7.3l-2 2" stroke="#1C2B3A" stroke-width="2.6" stroke-linecap="round"/></svg></span></div>
                <div class="tile sky"><span style="width:32px"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M6 20a10 10 0 0 1 20 0z" fill="#FFC51A"/><path d="M2.5 20h27M9 25h14" stroke="#1C2B3A" stroke-width="3" stroke-linecap="round"/><path d="M16 3.5v3M6.8 7.3l2 2M25.2 7.3l-2 2" stroke="#1C2B3A" stroke-width="2.6" stroke-linecap="round"/></svg></span><span style="width:96px"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M6 20a10 10 0 0 1 20 0z" fill="#FFC51A"/><path d="M2.5 20h27M9 25h14" stroke="#1C2B3A" stroke-width="3" stroke-linecap="round"/><path d="M16 3.5v3M6.8 7.3l2 2M25.2 7.3l-2 2" stroke="#1C2B3A" stroke-width="2.6" stroke-linecap="round"/></svg></span></div>
            </div>
        </section>
        <section>
            <h2>G3. Sunny side</h2>
            <div class="row">
                <div class="tile paper"><span style="width:16px"><svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="#1C2B3A"/><path d="M6.1 25.9A14 14 0 0 1 25.9 6.1z" fill="#FFC51A"/></svg></span><span style="width:32px"><svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="#1C2B3A"/><path d="M6.1 25.9A14 14 0 0 1 25.9 6.1z" fill="#FFC51A"/></svg></span><span style="width:64px"><svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="#1C2B3A"/><path d="M6.1 25.9A14 14 0 0 1 25.9 6.1z" fill="#FFC51A"/></svg></span><span style="width:160px"><svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="#1C2B3A"/><path d="M6.1 25.9A14 14 0 0 1 25.9 6.1z" fill="#FFC51A"/></svg></span></div>
                <div class="tile sky"><span style="width:32px"><svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="#1C2B3A"/><path d="M6.1 25.9A14 14 0 0 1 25.9 6.1z" fill="#FFC51A"/></svg></span><span style="width:96px"><svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="#1C2B3A"/><path d="M6.1 25.9A14 14 0 0 1 25.9 6.1z" fill="#FFC51A"/></svg></span></div>
            </div>
        </section>
        <section>
            <h2>G4. Tittle</h2>
            <div class="row">
                <div class="tile paper"><span style="width:16px"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 1.5v4.5M16 26v4.5M1.5 16H6M26 16h4.5M5.75 5.75l3.2 3.2M23.05 23.05l3.2 3.2M5.75 26.25l3.2-3.2M23.05 8.95l3.2-3.2" stroke="#1C2B3A" stroke-width="3.2" stroke-linecap="round"/><circle cx="16" cy="16" r="7.5" fill="#FFC51A"/></svg></span><span style="width:32px"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 1.5v4.5M16 26v4.5M1.5 16H6M26 16h4.5M5.75 5.75l3.2 3.2M23.05 23.05l3.2 3.2M5.75 26.25l3.2-3.2M23.05 8.95l3.2-3.2" stroke="#1C2B3A" stroke-width="3.2" stroke-linecap="round"/><circle cx="16" cy="16" r="7.5" fill="#FFC51A"/></svg></span><span style="width:64px"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 1.5v4.5M16 26v4.5M1.5 16H6M26 16h4.5M5.75 5.75l3.2 3.2M23.05 23.05l3.2 3.2M5.75 26.25l3.2-3.2M23.05 8.95l3.2-3.2" stroke="#1C2B3A" stroke-width="3.2" stroke-linecap="round"/><circle cx="16" cy="16" r="7.5" fill="#FFC51A"/></svg></span><span style="width:160px"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 1.5v4.5M16 26v4.5M1.5 16H6M26 16h4.5M5.75 5.75l3.2 3.2M23.05 23.05l3.2 3.2M5.75 26.25l3.2-3.2M23.05 8.95l3.2-3.2" stroke="#1C2B3A" stroke-width="3.2" stroke-linecap="round"/><circle cx="16" cy="16" r="7.5" fill="#FFC51A"/></svg></span></div>
                <div class="tile sky"><span style="width:32px"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 1.5v4.5M16 26v4.5M1.5 16H6M26 16h4.5M5.75 5.75l3.2 3.2M23.05 23.05l3.2 3.2M5.75 26.25l3.2-3.2M23.05 8.95l3.2-3.2" stroke="#1C2B3A" stroke-width="3.2" stroke-linecap="round"/><circle cx="16" cy="16" r="7.5" fill="#FFC51A"/></svg></span><span style="width:96px"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 1.5v4.5M16 26v4.5M1.5 16H6M26 16h4.5M5.75 5.75l3.2 3.2M23.05 23.05l3.2 3.2M5.75 26.25l3.2-3.2M23.05 8.95l3.2-3.2" stroke="#1C2B3A" stroke-width="3.2" stroke-linecap="round"/><circle cx="16" cy="16" r="7.5" fill="#FFC51A"/></svg></span></div>
            </div>
        </section>
        <section>
            <h2>G5. Stamp</h2>
            <div class="row">
                <div class="tile paper"><span style="width:16px"><svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#0A5BD8"/><path d="M8 21a8 8 0 0 1 16 0z" fill="#FFC51A"/><path d="M5 24.5h22" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg></span><span style="width:32px"><svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#0A5BD8"/><path d="M8 21a8 8 0 0 1 16 0z" fill="#FFC51A"/><path d="M5 24.5h22" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg></span><span style="width:64px"><svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#0A5BD8"/><path d="M8 21a8 8 0 0 1 16 0z" fill="#FFC51A"/><path d="M5 24.5h22" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg></span><span style="width:160px"><svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#0A5BD8"/><path d="M8 21a8 8 0 0 1 16 0z" fill="#FFC51A"/><path d="M5 24.5h22" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg></span></div>
                <div class="tile sky"><span style="width:32px"><svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#0A5BD8"/><path d="M8 21a8 8 0 0 1 16 0z" fill="#FFC51A"/><path d="M5 24.5h22" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg></span><span style="width:96px"><svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#0A5BD8"/><path d="M8 21a8 8 0 0 1 16 0z" fill="#FFC51A"/><path d="M5 24.5h22" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg></span></div>
            </div>
        </section>
        <section>
            <h2>G6. Stripes</h2>
            <div class="row">
                <div class="tile paper"><span style="width:16px"><svg viewBox="0 0 32 32" aria-hidden="true"><defs><clipPath id="c"><circle cx="16" cy="16" r="14"/></clipPath></defs><g clip-path="url(#c)" fill="#FFB000"><rect x="0" y="0" width="32" height="15"/><rect x="0" y="17" width="32" height="3.6"/><rect x="0" y="22.8" width="32" height="2.6"/><rect x="0" y="27.4" width="32" height="1.6"/></g></svg></span><span style="width:32px"><svg viewBox="0 0 32 32" aria-hidden="true"><defs><clipPath id="c"><circle cx="16" cy="16" r="14"/></clipPath></defs><g clip-path="url(#c)" fill="#FFB000"><rect x="0" y="0" width="32" height="15"/><rect x="0" y="17" width="32" height="3.6"/><rect x="0" y="22.8" width="32" height="2.6"/><rect x="0" y="27.4" width="32" height="1.6"/></g></svg></span><span style="width:64px"><svg viewBox="0 0 32 32" aria-hidden="true"><defs><clipPath id="c"><circle cx="16" cy="16" r="14"/></clipPath></defs><g clip-path="url(#c)" fill="#FFB000"><rect x="0" y="0" width="32" height="15"/><rect x="0" y="17" width="32" height="3.6"/><rect x="0" y="22.8" width="32" height="2.6"/><rect x="0" y="27.4" width="32" height="1.6"/></g></svg></span><span style="width:160px"><svg viewBox="0 0 32 32" aria-hidden="true"><defs><clipPath id="c"><circle cx="16" cy="16" r="14"/></clipPath></defs><g clip-path="url(#c)" fill="#FFB000"><rect x="0" y="0" width="32" height="15"/><rect x="0" y="17" width="32" height="3.6"/><rect x="0" y="22.8" width="32" height="2.6"/><rect x="0" y="27.4" width="32" height="1.6"/></g></svg></span></div>
                <div class="tile sky"><span style="width:32px"><svg viewBox="0 0 32 32" aria-hidden="true"><defs><clipPath id="c"><circle cx="16" cy="16" r="14"/></clipPath></defs><g clip-path="url(#c)" fill="#FFB000"><rect x="0" y="0" width="32" height="15"/><rect x="0" y="17" width="32" height="3.6"/><rect x="0" y="22.8" width="32" height="2.6"/><rect x="0" y="27.4" width="32" height="1.6"/></g></svg></span><span style="width:96px"><svg viewBox="0 0 32 32" aria-hidden="true"><defs><clipPath id="c"><circle cx="16" cy="16" r="14"/></clipPath></defs><g clip-path="url(#c)" fill="#FFB000"><rect x="0" y="0" width="32" height="15"/><rect x="0" y="17" width="32" height="3.6"/><rect x="0" y="22.8" width="32" height="2.6"/><rect x="0" y="27.4" width="32" height="1.6"/></g></svg></span></div>
            </div>
        </section>
    </main>
</body>
</html>
